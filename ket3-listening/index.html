<style>
:root{--or:#E8730C;--or2:#C45A00;--cream:#FFF4EA;--peach:#FFE7D3;--line:#F2C9A6;--ink:#2B2B2B;--mute:#8a7f76;--bg:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);padding:16px 16px 40px;min-height:100vh}
.wrap{max-width:760px;margin:0 auto}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.12em;color:#9a8a7c;margin-bottom:12px}
.top b{color:var(--or);display:flex;align-items:center;gap:6px}
.top b:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--or)}
.hero{background:var(--or);color:#fff;border-radius:22px;padding:20px 20px 18px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12);right:-50px;top:-80px}
.kick{font-size:11px;font-weight:800;letter-spacing:.2em;opacity:.9}
.hero h1{font-size:clamp(30px,8vw,44px);font-weight:900;line-height:1;margin-top:4px}
.hero p{font-size:16px;font-weight:800;margin-top:4px}
.tabs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:1}
.tabs button{background:rgba(255,255,255,.22);color:#fff;font-weight:800;font-size:14px;border-radius:99px;padding:8px 16px}
.tabs button.on{background:#fff;color:var(--or)}
.parts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.parts button{border:2px solid var(--line);border-radius:14px;padding:9px 6px;text-align:left;background:#fff}
.parts button .k{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--or2)}
.parts button .t{font-size:12.5px;font-weight:700;margin-top:2px;line-height:1.25}
.parts button.on{background:var(--or);border-color:var(--or)}
.parts button.on .k,.parts button.on .t{color:#fff}
.player{position:sticky;top:8px;z-index:5;margin-top:14px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 8px 22px rgba(120,60,10,.10)}
.prow{display:flex;align-items:center;gap:12px}
.big{flex:none;width:54px;height:54px;border-radius:50%;background:var(--or);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(232,115,12,.35)}
.pmeta{flex:1;min-width:0}
.pttl{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstat{font-size:12px;color:var(--mute);font-weight:600;margin-top:1px}
input[type=range]{width:100%;accent-color:var(--or);margin-top:6px;height:22px}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ctrls button{background:var(--cream);color:var(--or2);font-weight:800;font-size:13px;border-radius:12px;padding:8px 11px}
.ctrls .sp{margin-left:auto;display:flex;gap:4px}
.ctrls .sp button{padding:8px 9px}
.ctrls .sp button.on{background:var(--or);color:#fff}
.hint{background:var(--cream);border-radius:14px;padding:11px 13px;font-size:13px;color:#5a5048;margin-top:14px;line-height:1.45}
.hint b{color:var(--or2)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.bar h2{font-size:15px;font-weight:900;color:var(--or)}
.rev{background:var(--peach);color:var(--or2);font-weight:800;font-size:12.5px;border-radius:99px;padding:7px 12px}
.block{margin-top:14px}
.bh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tag{background:var(--or);color:#fff;font-weight:800;font-size:12px;border-radius:99px;padding:4px 11px}
.tag.ex{background:var(--peach);color:var(--or2)}
.q{font-weight:800;font-size:14px}
.ln{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:14px;transition:background .15s}
.ln.now{background:var(--cream)}
.no{flex:none;width:42px;height:42px;border-radius:50%;background:var(--peach);color:var(--or2);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;position:relative}
.no:after{content:"▶";position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:var(--or);color:#fff;font-size:8px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.ln.now .no{background:var(--or);color:#fff}
.ln.now .no:after{content:"♪"}
.who{flex:none;width:62px;font-size:12.5px;font-weight:700;color:var(--mute)}
.txt{flex:1;min-width:0;font-size:14.5px;line-height:1.4;font-weight:600}
.txt.ex{color:#a39a92;font-style:italic;font-weight:500}
.hid{display:inline-flex;align-items:center;gap:6px;color:#c7bbb0;font-weight:700;font-size:13px;border-bottom:2px dotted #d8ccc1;padding-bottom:2px;cursor:pointer;user-select:none}
.hid:before{content:"👁";font-size:12px;opacity:.7}
.cnt{flex:none;font-size:11px;color:#b0a69d;font-weight:600}
.foot{margin-top:28px;text-align:center;font-size:11.5px;color:#9a8a7c;font-weight:600}
@media (max-width:480px){.tabs{gap:6px}.tabs button{padding:8px 12px;font-size:13px}.parts button .k{font-size:10.5px;letter-spacing:.04em;white-space:nowrap}.parts button .t{display:none}.parts button{text-align:center}.ctrls{flex-wrap:nowrap;gap:4px}.ctrls button{font-size:12px;padding:7px 7px}.ctrls .sp{gap:3px}.ctrls .sp button{padding:7px 6px}.big{width:48px;height:48px;font-size:19px}.player{padding:10px 11px}.who{width:48px;font-size:11.5px}.parts button .t{font-size:11.5px}.cnt{display:none}}
</style>
</head>

<script>
const DATA=[{"key": "1_1", "test": 1, "part": 1, "title": "5 short conversations", "blocks": [{"label": "Example", "q": "How many people were at the meeting?", "lines": [{"who": "Woman", "t": "Were there many people at the meeting?", "s": 76.36, "e": 78.53}, {"who": "Man", "t": "About thirty.", "s": 78.58, "e": 79.95}, {"who": "Woman", "t": "That's not many.", "s": 79.94, "e": 81.32}, {"who": "Man", "t": "No, but more than last time.", "s": 81.27, "e": 83.54}]}, {"label": "Question 1", "q": "When did Gary start his new job?", "lines": [{"who": "Woman", "t": "Hello, Gary. I haven't seen you since March.", "s": 107.9, "e": 111.32}, {"who": "Man", "t": "Hi, Jane. No, I've been busy with my new job.", "s": 111.21, "e": 115.47}, {"who": "Woman", "t": "Really? When did you start that?", "s": 115.33, "e": 118.29}, {"who": "Man", "t": "May. I left my last job in April.", "s": 118.11, "e": 121.08}]}, {"label": "Question 2", "q": "What time does the film start?", "lines": [{"who": "Woman", "t": "Hello, Odeon Cinema.", "s": 152.68, "e": 154.91}, {"who": "Man", "t": "Could you tell me what time the film starts, please?", "s": 155.41, "e": 158.37}, {"who": "Woman", "t": "Certainly. There are two screenings, one at four thirty and the other at seven.", "s": 158.62, "e": 165.22}, {"who": "Man", "t": "Thank you very much.", "s": 165.53, "e": 166.93}]}, {"label": "Question 3", "q": "What was the weather like on Saturday?", "lines": [{"who": "Man", "t": "Did you have good weather at the beach at the weekend?", "s": 200.37, "e": 203.29}, {"who": "Woman", "t": "Yes, it was sunny all weekend.", "s": 203.24, "e": 205.98}, {"who": "Man", "t": "Wasn't it windy too?", "s": 205.92, "e": 207.91}, {"who": "Woman", "t": "Only on Sunday.", "s": 207.91, "e": 209.43}]}, {"label": "Question 4", "q": "Which motorway will they take?", "lines": [{"who": "Woman", "t": "I've put the luggage in the car. Can we leave now?", "s": 236.49, "e": 239.61}, {"who": "Man", "t": "OK. We'll go on the M6 motorway.", "s": 239.92, "e": 242.24}, {"who": "Woman", "t": "Isn't it faster on the M1 and then the M62?", "s": 241.87, "e": 246.74}, {"who": "Man", "t": "Yes, usually, but there's been an accident on the M1 so I don't want to go that way.", "s": 246.51, "e": 251.45}]}, {"label": "Question 5", "q": "Which book does Lorna want?", "lines": [{"who": "Man", "t": "Have you finished studying yet, Lorna?", "s": 286.32, "e": 288.63}, {"who": "Girl", "t": "No, not yet. Could you give me that book, please?", "s": 288.68, "e": 293.68}, {"who": "Man", "t": "Which one? There are three here. This one on the sofa?", "s": 293.48, "e": 298.01}, {"who": "Girl", "t": "No, the one on the chair next to the sofa, please.", "s": 298.28, "e": 301.94}]}]}, {"key": "1_2", "test": 1, "part": 2, "title": "Matching", "blocks": [{"label": "Conversation", "q": null, "lines": [{"who": "Friend", "t": "Hi, Sue. Have you been to the shops?", "s": 31.52, "e": 33.88}, {"who": "Sue", "t": "Yes. I had some money for my birthday so I decided to buy some clothes.", "s": 33.51, "e": 38.54}, {"who": "Friend", "t": "I love those purple jeans.", "s": 38.17, "e": 40.36}, {"who": "Sue", "t": "Yes, I bought them because purple is my favourite colour.", "s": 39.99, "e": 43.78}, {"who": "Sue", "t": "I got a new jacket too.", "s": 43.41, "e": 46.06}, {"who": "Sue", "t": "My old one is too small, so I bought this lovely big one.", "s": 46.23, "e": 50.38}, {"who": "Friend", "t": "It's really great — did you buy a dress?", "s": 50.17, "e": 53.35}, {"who": "Sue", "t": "I got this one because it was only nine pounds!", "s": 53.22, "e": 56.91}, {"who": "Friend", "t": "That's not expensive!", "s": 56.81, "e": 58.62}, {"who": "Sue", "t": "Then I got a sweater to wear with my jeans.", "s": 58.79, "e": 62.21}, {"who": "Friend", "t": "It's lovely and soft.", "s": 62.23, "e": 64.39}, {"who": "Sue", "t": "That's why I bought it.", "s": 64.02, "e": 65.81}, {"who": "Friend", "t": "Anything else?", "s": 65.44, "e": 66.7}, {"who": "Sue", "t": "A coat. The long one I have is too big and heavy, but this one is really light.", "s": 66.54, "e": 73.05}, {"who": "Friend", "t": "Did you buy a short white t-shirt like mine?", "s": 72.68, "e": 75.45}, {"who": "Sue", "t": "Well, I bought a long white one.", "s": 75.08, "e": 77.78}, {"who": "Sue", "t": "I'll wear it more often than a short one.", "s": 77.89, "e": 80.23}]}]}, {"key": "1_3", "test": 1, "part": 3, "title": "Multiple choice", "blocks": [{"label": "Conversation", "q": null, "lines": [{"who": "Jan", "t": "Hi, Steve!", "s": 51.01, "e": 51.98}, {"who": "Steve", "t": "Hi, Jan. I'm going to go to London on the train. Come with me!", "s": 52.06, "e": 56.22}, {"who": "Jan", "t": "But it's cheaper by bus.", "s": 56.16, "e": 58.08}, {"who": "Steve", "t": "I've got a student travel card. You can get cheap train tickets with it.", "s": 58.08, "e": 62.72}, {"who": "Jan", "t": "That sounds good. How much does it cost?", "s": 62.35, "e": 65.5}, {"who": "Steve", "t": "A card for six months is sixteen pounds.", "s": 65.45, "e": 68.92}, {"who": "Jan", "t": "So how do I get one?", "s": 68.55, "e": 70.31}, {"who": "Steve", "t": "You need some photographs — one for the card and one for the form.", "s": 70.35, "e": 74.89}, {"who": "Jan", "t": "Oh. There's a photo machine in the post office.", "s": 74.83, "e": 78.48}, {"who": "Jan", "t": "It gives you four photos for three pounds.", "s": 78.51, "e": 81.58}, {"who": "Steve", "t": "So does the one in the library. But I went to a photographer's shop.", "s": 81.45, "e": 85.73}, {"who": "Steve", "t": "It was cheaper.", "s": 85.62, "e": 86.79}, {"who": "Jan", "t": "I don't have to show my passport or my driving licence, do I?", "s": 87.27, "e": 90.98}, {"who": "Steve", "t": "That's right, Jan, you only need a letter from your college.", "s": 90.61, "e": 94.01}, {"who": "Jan", "t": "I'll ask my teacher for one.", "s": 93.89, "e": 95.66}, {"who": "Steve", "t": "And then you take everything to the tourist office, by the travel agents.", "s": 95.73, "e": 99.56}, {"who": "Jan", "t": "Great, next time you go to London, I'll come too!", "s": 99.34, "e": 103.13}]}]}, {"key": "1_4", "test": 1, "part": 4, "title": "Note completion", "blocks": [{"label": "Conversation", "q": null, "lines": [{"who": "Woman", "t": "Waterhouse School, can I help you?", "s": 24.23, "e": 26.37}, {"who": "Mr Graham", "t": "Hello, can I leave a message for Mr Brown, please?", "s": 26.56, "e": 29.82}, {"who": "Woman", "t": "Yes, of course. What's your name?", "s": 29.6, "e": 31.67}, {"who": "Mr Graham", "t": "David Graham.", "s": 31.77, "e": 33.06}, {"who": "Woman", "t": "Could you spell your surname for me, please?", "s": 33.02, "e": 35.52}, {"who": "Mr Graham", "t": "Yes, it's G-R-A-H-A-M.", "s": 35.65, "e": 41.89}, {"who": "Woman", "t": "Right, I've got that. What's the message?", "s": 42.54, "e": 45.39}, {"who": "Mr Graham", "t": "Well, I can't teach my classes for a few days because my back's bad again.", "s": 45.53, "e": 50.43}, {"who": "Woman", "t": "Oh dear! A bad back.", "s": 50.37, "e": 53.67}, {"who": "Mr Graham", "t": "Yes. Can you ask Mr Brown to tell the students to read their course book.", "s": 53.63, "e": 58.67}, {"who": "Mr Graham", "t": "They should start at page 58 and read to page 73.", "s": 58.67, "e": 63.5}, {"who": "Woman", "t": "OK, I've got that. Anything else?", "s": 63.75, "e": 66.83}, {"who": "Mr Graham", "t": "Er yes ... tell Mr Brown that I've been to the doctor and I can't come back to work until Tuesday.", "s": 66.87, "e": 73.58}, {"who": "Woman", "t": "That's in the morning, is it?", "s": 73.21, "e": 75.31}, {"who": "Mr Graham", "t": "No, not until the afternoon. I'll be there for my first class.", "s": 75.7, "e": 80.0}, {"who": "Mr Graham", "t": "It starts at quarter past two.", "s": 80.02, "e": 81.97}, {"who": "Woman", "t": "Right. I'll tell him. I hope you feel better soon.", "s": 82.08, "e": 85.64}, {"who": "Mr Graham", "t": "Thanks very much. Bye.", "s": 85.9, "e": 87.75}, {"who": "Woman", "t": "Goodbye.", "s": 87.66, "e": 88.47}]}]}, {"key": "1_5", "test": 1, "part": 5, "title": "Note completion", "blocks": [{"label": "Conversation", "q": null, "lines": [{"who": "Man", "t": "You are listening to Radio South. Here is some information about a pop concert.", "s": 23.57, "e": 29.76}, {"who": "Man", "t": "The group Red River will come to London soon.", "s": 30.02, "e": 33.85}, {"who": "Man", "t": "They will be in London from the twenty-eighth of October to the second of November.", "s": 34.2, "e": 39.48}, {"who": "Man", "t": "After that they will be in Oxford from the fourth of November until the ninth.", "s": 40.26, "e": 45.58}, {"who": "Man", "t": "Tickets are quite expensive — they cost thirty-seven pounds each, but half of that money will go to a children's hospital.", "s": 45.98, "e": 54.59}, {"who": "Man", "t": "Tickets will sell quickly for this famous band so book early.", "s": 55.22, "e": 59.42}, {"who": "Man", "t": "To book a ticket for a London concert, telephone two-eight-three, double-oh-six-five between ten a.m. and ten p.m.", "s": 60.1, "e": 70.28}, {"who": "Man", "t": "Have a credit card number ready.", "s": 69.91, "e": 73.36}, {"who": "Man", "t": "The London concerts will be in South Bank Hall. It's very easy to find.", "s": 73.95, "e": 80.23}, {"who": "Man", "t": "The best way to get there is to take the train.", "s": 80.85, "e": 84.06}, {"who": "Man", "t": "The concert hall is in Trinity Street. That's T-R-I-N-I-T-Y Street. See you there.", "s": 84.7, "e": 98.15}, {"who": "Man", "t": "For classical music lovers ...", "s": 98.77, "e": 100.56}]}]}, {"key": "2_1", "test": 2, "part": 1, "title": "5 short conversations", "blocks": [{"label": "Example", "q": "How many people were at the meeting?", "lines": [{"who": "Woman", "t": "Were there many people at the meeting?", "s": 60.53, "e": 62.69}, {"who": "Man", "t": "About thirty.", "s": 62.71, "e": 64.0}, {"who": "Woman", "t": "That's not many.", "s": 63.63, "e": 65.29}, {"who": "Man", "t": "No, but more than last time.", "s": 65.28, "e": 67.49}]}, {"label": "Question 1", "q": "What colour is Kathy's bedroom now?", "lines": [{"who": "Kathy", "t": "Come and look at my bedroom. I've painted it.", "s": 91.35, "e": 94.51}, {"who": "Man", "t": "What colour this time, Kathy? Green?", "s": 94.14, "e": 96.86}, {"who": "Kathy", "t": "I decided to paint it blue.", "s": 96.87, "e": 99.15}, {"who": "Man", "t": "Oh well, that's nicer than before. I hated those pink walls.", "s": 99.26, "e": 104.3}]}, {"label": "Question 2", "q": "Which platform does the woman's train leave from?", "lines": [{"who": "Woman", "t": "Which is the platform for the train to London?", "s": 136.45, "e": 139.29}, {"who": "Man", "t": "The fast train leaves from platform six at seven o'clock.", "s": 139.54, "e": 144.07}, {"who": "Woman", "t": "I want to go to Rugby — does it stop there?", "s": 144.1, "e": 147.51}, {"who": "Man", "t": "You need the slow train from platform two at seven ten.", "s": 147.56, "e": 152.09}]}, {"label": "Question 3", "q": "How is Susan going to get to the airport?", "lines": [{"who": "Man", "t": "How are you going to go to the airport on Tuesday, Susan?", "s": 187.49, "e": 190.44}, {"who": "Susan", "t": "I'm going to take the coach. I can get off just outside the airport.", "s": 190.44, "e": 194.65}, {"who": "Susan", "t": "A taxi's too expensive.", "s": 194.76, "e": 196.55}, {"who": "Man", "t": "There's a train you can get. It's very fast.", "s": 196.46, "e": 199.35}, {"who": "Susan", "t": "That's only at the weekends.", "s": 198.98, "e": 201.08}]}, {"label": "Question 4", "q": "Which is Anna's family?", "lines": [{"who": "Man", "t": "Tell me about your family, Anna.", "s": 234.09, "e": 236.06}, {"who": "Anna", "t": "Well, my father's tall with dark hair and my mother's the opposite.", "s": 236.44, "e": 243.16}, {"who": "Anna", "t": "She's shorter and blonde. Then there's my brother.", "s": 243.18, "e": 248.12}, {"who": "Man", "t": "Is he older than you?", "s": 248.26, "e": 249.64}, {"who": "Anna", "t": "He's five years younger.", "s": 249.6, "e": 251.44}]}, {"label": "Question 5", "q": "When is Kim's birthday party?", "lines": [{"who": "Man", "t": "Are you going to Kim's birthday party? She'll be sixteen in June.", "s": 288.66, "e": 293.06}, {"who": "Woman", "t": "Oh, yes. It's on the eleventh, isn't it?", "s": 293.12, "e": 296.71}, {"who": "Man", "t": "That's right. It'll be quite a big party — about thirty people, I think.", "s": 296.63, "e": 301.47}, {"who": "Woman", "t": "OK. I'll see you there.", "s": 301.53, "e": 303.59}]}]}, {"key": "2_2", "test": 2, "part": 2, "title": "Matching", "blocks": [{"label": "Conversation", "q": null, "lines": [{"who": "Steve", "t": "Hi, Rose. Can you help me with my English homework?", "s": 36.42, "e": 40.06}, {"who": "Rose", "t": "Er, no, Steve. I'm very busy this morning.", "s": 39.94, "e": 44.14}, {"who": "Rose", "t": "At nine o'clock I'm going to see the doctor.", "s": 44.36, "e": 47.44}, {"who": "Steve", "t": "Well, what are you going to do after that?", "s": 47.78, "e": 50.26}, {"who": "Rose", "t": "I go swimming every day now — just for one hour — so I'm going to do that at ten.", "s": 50.21, "e": 56.1}, {"who": "Steve", "t": "Well, can I meet you at eleven?", "s": 57.0, "e": 59.01}, {"who": "Rose", "t": "Sorry, I've got to see my maths teacher then.", "s": 58.9, "e": 62.21}, {"who": "Steve", "t": "And then I suppose you'll go to the library to study.", "s": 62.3, "e": 65.18}, {"who": "Rose", "t": "Not today! At twelve I must meet Bill. I need to talk to him.", "s": 64.81, "e": 70.48}, {"who": "Steve", "t": "So I'll see you at lunchtime. At one o'clock?", "s": 70.57, "e": 73.59}, {"who": "Rose", "t": "I'm going to have lunch with Jo then, but you can come too.", "s": 73.64, "e": 78.43}, {"who": "Steve", "t": "No, thanks. I'll see you afterwards.", "s": 78.06, "e": 81.21}, {"who": "Rose", "t": "Well, I have an art class at two.", "s": 81.1, "e": 83.92}, {"who": "Rose", "t": "But I can help you after that.", "s": 83.55, "e": 86.16}, {"who": "Steve", "t": "OK. I'll see you at three then.", "s": 86.06, "e": 88.76}]}]}, {"key": "2_3", "test": 2, "part": 3, "title": "Multiple choice", "blocks": [{"label": "Conversation", "q": null, "lines": [{"who": "Friend", "t": "Peter, you're learning to drive, aren't you?", "s": 52.2, "e": 55.31}, {"who": "Friend", "t": "Do you go to the AA Driving School?", "s": 55.4, "e": 58.05}, {"who": "Peter", "t": "Actually it's called the ABC Driving School.", "s": 58.31, "e": 61.56}, {"who": "Friend", "t": "Is it expensive? I want to learn to drive.", "s": 61.81, "e": 65.17}, {"who": "Peter", "t": "It's cost me a hundred and forty pounds already.", "s": 65.04, "e": 68.21}, {"who": "Peter", "t": "I've had ten lessons and each one is fourteen pounds.", "s": 68.41, "e": 72.25}, {"who": "Friend", "t": "Is that for an hour?", "s": 72.15, "e": 73.64}, {"who": "Peter", "t": "Mm ... less than that — about three quarters of an hour.", "s": 74.3, "e": 78.58}, {"who": "Friend", "t": "I see. And is the teacher's car new?", "s": 78.21, "e": 82.71}, {"who": "Peter", "t": "Yes, and it's not a big car so parking's easy, but it doesn't go very fast!", "s": 82.34, "e": 88.19}, {"who": "Friend", "t": "When are you going to take your driving test?", "s": 87.82, "e": 90.13}, {"who": "Peter", "t": "I failed it last week.", "s": 90.07, "e": 91.97}, {"who": "Peter", "t": "The traffic lights were red but I didn't see them and I couldn't brake in time.", "s": 92.51, "e": 97.29}, {"who": "Friend", "t": "Never mind. You can take the test again. Tell me about your teacher.", "s": 97.84, "e": 102.97}, {"who": "Friend", "t": "Is he friendly?", "s": 102.6, "e": 104.48}, {"who": "Peter", "t": "He's OK, he's quite young and interesting to talk to, but my father will give me my next lessons.", "s": 104.31, "e": 111.43}, {"who": "Peter", "t": "He's cheaper!", "s": 111.48, "e": 112.7}, {"who": "Friend", "t": "Well, good luck!", "s": 113.19, "e": 114.87}]}]}, {"key": "2_4", "test": 2, "part": 4, "title": "Note completion", "blocks": [{"label": "Conversation", "q": null, "lines": [{"who": "Woman", "t": "Playhouse Theatre. Can I help you?", "s": 38.01, "e": 40.2}, {"who": "Man", "t": "Yes, I'd like some information about the plays that are on next week, please.", "s": 40.48, "e": 45.53}, {"who": "Woman", "t": "Certainly. We have two plays next week.", "s": 45.42, "e": 49.16}, {"who": "Woman", "t": "The White Room is on at seven thirty every evening.", "s": 48.79, "e": 52.7}, {"who": "Woman", "t": "Then in the afternoons we have a play by a new young writer.", "s": 53.12, "e": 57.44}, {"who": "Woman", "t": "The name of that is The School Bus. That's at three o'clock.", "s": 57.56, "e": 62.26}, {"who": "Man", "t": "The School Bus?", "s": 62.22, "e": 63.93}, {"who": "Woman", "t": "Yes, it's a play for children.", "s": 63.81, "e": 65.84}, {"who": "Man", "t": "Mmm ... and how much are tickets?", "s": 65.71, "e": 69.31}, {"who": "Woman", "t": "Well, tickets for seats upstairs cost fifteen pounds and those for downstairs are twelve pounds fifty.", "s": 69.21, "e": 78.19}, {"who": "Man", "t": "Are the prices the same for all performances?", "s": 78.34, "e": 81.24}, {"who": "Woman", "t": "No, all tickets are six pounds on Mondays.", "s": 81.15, "e": 85.62}, {"who": "Woman", "t": "But you'll have to buy them soon if you want some of those.", "s": 85.73, "e": 89.11}, {"who": "Man", "t": "OK. And one more thing ... is there a car park near the theatre?", "s": 89.04, "e": 93.63}, {"who": "Woman", "t": "Yes, in Stuart Street.", "s": 93.59, "e": 95.88}, {"who": "Man", "t": "Can you spell that, please?", "s": 95.98, "e": 97.56}, {"who": "Woman", "t": "Certainly. It's S-T-U-A-R-T. It's just behind the theatre.", "s": 97.78, "e": 105.75}, {"who": "Man", "t": "Thank you for your help.", "s": 105.88, "e": 107.26}, {"who": "Woman", "t": "OK. Goodbye.", "s": 107.43, "e": 108.97}]}]}, {"key": "2_5", "test": 2, "part": 5, "title": "Note completion", "blocks": [{"label": "Conversation", "q": null, "lines": [{"who": "Man", "t": "This is the Mill House Health Centre.", "s": 28.99, "e": 31.33}, {"who": "Man", "t": "The Health Centre is closed until eight o'clock tomorrow morning, but here is some important information.", "s": 32.29, "e": 38.5}, {"who": "Man", "t": "To make an appointment with one of the doctors you can phone us tomorrow.", "s": 39.68, "e": 43.69}, {"who": "Man", "t": "The number is seven nine three double two oh.", "s": 44.13, "e": 47.86}, {"who": "Man", "t": "The Health Centre is always very busy early in the morning so please do not phone before eight-thirty.", "s": 48.95, "e": 54.85}, {"who": "Man", "t": "If you want to get medicine, Padley's Chemist's Shop, that's P-A-D-L-E-Y-S,", "s": 56.37, "e": 64.62}, {"who": "Man", "t": "is open until ten p.m. every evening this week, including Sundays.", "s": 64.96, "e": 69.95}, {"who": "Man", "t": "Take the 77 bus to the High Street.", "s": 70.8, "e": 73.48}, {"who": "Man", "t": "The stop is right outside the shop.", "s": 73.76, "e": 76.13}, {"who": "Man", "t": "If you need to see a doctor now, please go to the accident department at University Hospital.", "s": 77.2, "e": 83.78}, {"who": "Man", "t": "They are open twenty-four hours a day for accidents and emergencies.", "s": 84.67, "e": 88.6}, {"who": "Man", "t": "Thank you for calling the Mill House Health Centre this evening.", "s": 89.69, "e": 92.82}, {"who": "Man", "t": "Our doctors and nurses will be pleased to answer any more of your questions tomorrow.", "s": 93.4, "e": 97.92}]}]}, {"key": "3_1", "test": 3, "part": 1, "title": "5 short conversations", "blocks": [{"label": "Example", "q": "How many people were at the meeting?", "lines": [{"who": "Woman", "t": "Were there many people at the meeting?", "s": 63.57, "e": 65.61}, {"who": "Man", "t": "About thirty.", "s": 65.62, "e": 66.95}, {"who": "Woman", "t": "That's not many.", "s": 66.58, "e": 68.01}, {"who": "Man", "t": "No, but more than last time.", "s": 68.02, "e": 70.21}]}, {"label": "Question 1", "q": "When will they go on holiday?", "lines": [{"who": "Man 1", "t": "Do you want to come on holiday with me in the summer?", "s": 92.62, "e": 98.83}, {"who": "Man 2", "t": "Sure. I can go in June, July or September.", "s": 98.78, "e": 103.09}, {"who": "Man 1", "t": "Well, June will be best for me.", "s": 103.23, "e": 105.89}, {"who": "Man 1", "t": "July's too hot and I have to work in September.", "s": 106.02, "e": 109.49}, {"who": "Man 2", "t": "OK. Where shall we go?", "s": 109.31, "e": 111.47}]}, {"label": "Question 2", "q": "How is Patti going to travel?", "lines": [{"who": "Patti", "t": "I'm going to go to Vienna on Saturday.", "s": 146.22, "e": 148.53}, {"who": "Man", "t": "How long does it take to fly there, Patti?", "s": 148.62, "e": 150.87}, {"who": "Patti", "t": "Oh, I'm going to drive.", "s": 150.73, "e": 152.5}, {"who": "Man", "t": "Oh yes, you get ill on planes, don't you?", "s": 152.46, "e": 155.86}, {"who": "Patti", "t": "Yes, and trains.", "s": 155.49, "e": 157.95}]}, {"label": "Question 3", "q": "What will Sam do?", "lines": [{"who": "Mother", "t": "You must phone me while you're on holiday, Sam.", "s": 188.47, "e": 191.28}, {"who": "Sam", "t": "Telephoning's too expensive. I'll send you a postcard from the campsite.", "s": 191.31, "e": 196.55}, {"who": "Mother", "t": "But I'll want to know you're alright. Can't you send me a letter?", "s": 196.35, "e": 200.34}, {"who": "Sam", "t": "I won't have time for writing letters.", "s": 200.38, "e": 203.41}]}, {"label": "Question 4", "q": "What was the weather like in Portugal?", "lines": [{"who": "Man", "t": "What was the weather like in Portugal, Debbie?", "s": 238.21, "e": 241.18}, {"who": "Debbie", "t": "It was cloudy every day, but it didn't rain.", "s": 241.64, "e": 245.23}, {"who": "Man", "t": "Really? It was lovely and sunny on our holiday in Spain.", "s": 245.19, "e": 249.83}, {"who": "Debbie", "t": "Yes, but we were in the north of Portugal and it's different there.", "s": 250.2, "e": 254.32}]}, {"label": "Question 5", "q": "What has the girl broken?", "lines": [{"who": "Girl", "t": "Be careful, Mum, there are some pieces of glass on the floor.", "s": 289.11, "e": 293.0}, {"who": "Mother", "t": "You haven't broken that nice picture, have you?", "s": 292.96, "e": 295.83}, {"who": "Girl", "t": "It's alright. The lemonade bottle fell on the floor.", "s": 295.66, "e": 299.57}, {"who": "Mother", "t": "Oh well, at least it was empty.", "s": 299.2, "e": 301.45}]}]}, {"key": "3_2", "test": 3, "part": 2, "title": "Matching", "blocks": [{"label": "Conversation", "q": null, "lines": [{"who": "Mother", "t": "How was the party with your old school friends, Patrick?", "s": 35.74, "e": 38.67}, {"who": "Patrick", "t": "Great, Mother. We've changed a lot since 1990. Look at this photo.", "s": 38.83, "e": 43.79}, {"who": "Mother", "t": "Was Peter there?", "s": 44.43, "e": 45.74}, {"who": "Patrick", "t": "Yes, this is him in a sports jacket.", "s": 45.64, "e": 48.29}, {"who": "Mother", "t": "Oh, yes. And does Martin still wear a t-shirt and dirty jeans?", "s": 48.32, "e": 53.69}, {"who": "Patrick", "t": "Well, he's a businessman now, so he can't be dirty.", "s": 53.32, "e": 57.08}, {"who": "Patrick", "t": "But he was wearing jeans. Look.", "s": 57.13, "e": 59.37}, {"who": "Mother", "t": "Oh, yes. And is this person with the long coat Joanna?", "s": 59.48, "e": 64.35}, {"who": "Patrick", "t": "It's like her, isn't it, but Joanna's standing next to Amy and wearing a red sweater.", "s": 63.98, "e": 69.41}, {"who": "Mother", "t": "Is that Amy? I can't believe it. She's so thin!", "s": 69.63, "e": 73.59}, {"who": "Mother", "t": "That black dress doesn't look very good on her.", "s": 73.22, "e": 76.88}, {"who": "Patrick", "t": "She's been ill. That man in the big hat is her husband, James.", "s": 77.31, "e": 81.98}, {"who": "Mother", "t": "Oh? Isn't that Robert?", "s": 81.61, "e": 84.58}, {"who": "Patrick", "t": "No, see the man in the red t-shirt with the blue trousers? That's Robert.", "s": 84.69, "e": 89.84}, {"who": "Mother", "t": "How people change!", "s": 90.32, "e": 92.09}]}]}, {"key": "3_3", "test": 3, "part": 3, "title": "Multiple choice", "blocks": [{"label": "Conversation", "q": null, "lines": [{"who": "Mark", "t": "Hello, Jenny. What are you doing here?", "s": 52.86, "e": 55.57}, {"who": "Jenny", "t": "Mark! Hello! This is my daughter, Sarah.", "s": 55.46, "e": 59.66}, {"who": "Jenny", "t": "It's the school holidays so we're shopping now — we're not sure what to do after that.", "s": 60.46, "e": 65.98}, {"who": "Mark", "t": "Well, there's a show for children this afternoon in the library where I work.", "s": 65.97, "e": 70.77}, {"who": "Jenny", "t": "Oh? What time is the show?", "s": 70.4, "e": 73.26}, {"who": "Mark", "t": "It starts at two and finishes at three thirty.", "s": 73.09, "e": 76.43}, {"who": "Mark", "t": "It's only quarter past one now. What about that?", "s": 76.06, "e": 79.79}, {"who": "Jenny", "t": "How much is a ticket?", "s": 80.1, "e": 82.04}, {"who": "Mark", "t": "Well, it's one pound fifty for adults and seventy-five pence for children.", "s": 82.05, "e": 86.57}, {"who": "Mark", "t": "Programmes are twenty-five pence.", "s": 86.53, "e": 88.59}, {"who": "Jenny", "t": "And does your library do a reading course in the holidays?", "s": 88.22, "e": 92.6}, {"who": "Mark", "t": "Yes, and if children under ten, like Sarah,", "s": 92.23, "e": 95.73}, {"who": "Mark", "t": "read four books in six weeks, we give them something to take home.", "s": 95.36, "e": 99.8}, {"who": "Jenny", "t": "What, like, a book?", "s": 99.63, "e": 101.5}, {"who": "Mark", "t": "Well, this year it's a pen but sometimes it's a book or a school bag.", "s": 101.13, "e": 106.19}, {"who": "Mark", "t": "Meet me after the show and I'll tell you what to do.", "s": 106.29, "e": 108.93}, {"who": "Jenny", "t": "Thanks. See you later then.", "s": 108.82, "e": 111.48}]}]}, {"key": "3_4", "test": 3, "part": 4, "title": "Note completion", "blocks": [{"label": "Conversation", "q": null, "lines": [{"who": "Man", "t": "Good morning. Central School of Music.", "s": 32.16, "e": 34.82}, {"who": "Judy", "t": "Good morning. My name's Judy Black. I'd like some information about guitar lessons, please.", "s": 34.45, "e": 40.36}, {"who": "Man", "t": "Are you a beginner?", "s": 40.24, "e": 41.59}, {"who": "Judy", "t": "Yes, I've never played the guitar before.", "s": 41.55, "e": 44.39}, {"who": "Man", "t": "Then you'll want a beginners' class.", "s": 44.24, "e": 46.8}, {"who": "Man", "t": "There's one on Wednesday evening and another on Tuesday morning.", "s": 46.96, "e": 51.33}, {"who": "Judy", "t": "I work during the day so I'd like the evening class.", "s": 51.27, "e": 55.57}, {"who": "Man", "t": "It begins at half past seven and it's a two-hour class.", "s": 55.55, "e": 59.93}, {"who": "Judy", "t": "Oh, that will be fine for me.", "s": 59.76, "e": 61.63}, {"who": "Judy", "t": "Er, can you tell me how much I have to pay?", "s": 62.07, "e": 65.04}, {"who": "Man", "t": "Each lesson costs five pounds fifty.", "s": 65.34, "e": 68.13}, {"who": "Man", "t": "That's fifty-five pounds for a course of ten lessons.", "s": 68.22, "e": 72.17}, {"who": "Judy", "t": "That's not bad. But I haven't got a guitar. Does it matter?", "s": 71.8, "e": 75.94}, {"who": "Man", "t": "No, the school can lend you one.", "s": 76.1, "e": 78.32}, {"who": "Judy", "t": "Oh good. And can you tell me the name of the teacher?", "s": 78.27, "e": 82.05}, {"who": "Man", "t": "It's Mrs Capelle. That's C-A-P-E-L-L-E.", "s": 81.98, "e": 88.37}, {"who": "Judy", "t": "Right. What room will my lesson be in?", "s": 88.4, "e": 91.67}, {"who": "Man", "t": "Classroom number three hundred and twenty-eight on the third floor.", "s": 91.67, "e": 95.94}, {"who": "Judy", "t": "Great. Thank you very much. Bye.", "s": 95.77, "e": 98.74}, {"who": "Man", "t": "Bye.", "s": 98.79, "e": 99.54}]}]}, {"key": "3_5", "test": 3, "part": 5, "title": "Note completion", "blocks": [{"label": "Conversation", "q": null, "lines": [{"who": "Teacher", "t": "Right, listen carefully, everyone. I want to tell you about our school trip.", "s": 31.44, "e": 37.99}, {"who": "Teacher", "t": "We're going to go on Saturday. I hope you can all come.", "s": 38.28, "e": 42.34}, {"who": "Teacher", "t": "As you know, we're going to visit the film museum.", "s": 41.97, "e": 47.27}, {"who": "Teacher", "t": "There are lots of very interesting things there about the cinema and how films are made.", "s": 47.42, "e": 52.9}, {"who": "Teacher", "t": "We'll have to leave at eight forty-five so don't be late.", "s": 53.58, "e": 57.28}, {"who": "Teacher", "t": "We'll get there by bus. Please meet me in the car park.", "s": 57.69, "e": 62.25}, {"who": "Teacher", "t": "You all know where that is, don't you?", "s": 62.31, "e": 64.34}, {"who": "Teacher", "t": "And when we return, the bus will leave you at the school entrance.", "s": 64.33, "e": 69.82}, {"who": "Teacher", "t": "Tell your parents, won't you? What next? Oh yes, the cost.", "s": 69.45, "e": 77.28}, {"who": "Teacher", "t": "It'll be six pounds seventy pence each, OK?", "s": 77.47, "e": 81.29}, {"who": "Teacher", "t": "Remember to get the money from your parents.", "s": 81.5, "e": 83.74}, {"who": "Teacher", "t": "Now, I'm going to give you some work to do at the museum.", "s": 84.33, "e": 88.15}, {"who": "Teacher", "t": "You'll need to write things down, so take a pencil with you.", "s": 88.82, "e": 92.97}, {"who": "Teacher", "t": "We'll have lunch in the museum café so you needn't bring any food with you.", "s": 93.2, "e": 97.88}, {"who": "Teacher", "t": "Well, I think that's everything ...", "s": 98.46, "e": 100.93}]}]}, {"key": "4_1", "test": 4, "part": 1, "title": "5 short conversations", "blocks": [{"label": "Example", "q": "How many people were at the meeting?", "lines": [{"who": "Woman", "t": "Were there many people at the meeting?", "s": 61.6, "e": 63.77}, {"who": "Man", "t": "About thirty.", "s": 63.75, "e": 65.17}, {"who": "Woman", "t": "That's not many.", "s": 64.8, "e": 66.42}, {"who": "Man", "t": "No, but more than last time.", "s": 66.36, "e": 68.81}]}, {"label": "Question 1", "q": "Which is Tom's mother?", "lines": [{"who": "Woman", "t": "Is that your mother with the hat, Tom?", "s": 94.11, "e": 96.68}, {"who": "Tom", "t": "She never wears a hat.", "s": 96.61, "e": 98.27}, {"who": "Woman", "t": "Has she still got glasses and long hair?", "s": 98.38, "e": 100.8}, {"who": "Tom", "t": "Her hair's short now. But she still wears glasses.", "s": 100.75, "e": 104.38}]}, {"label": "Question 2", "q": "Where will the beach party be?", "lines": [{"who": "Man", "t": "Hi, Jane. Going to the beach party tonight?", "s": 132.9, "e": 136.01}, {"who": "Jane", "t": "Yes. Is it in the same place as last week's — by the boats?", "s": 135.64, "e": 139.91}, {"who": "Man", "t": "It's going to be by the trees this time.", "s": 139.73, "e": 142.18}, {"who": "Jane", "t": "I'll meet you at the café then.", "s": 142.16, "e": 143.93}]}, {"label": "Question 3", "q": "What will Fiona wear to the dance?", "lines": [{"who": "Fiona", "t": "Shall I wear this skirt or my new trousers to the dance tonight, Mum?", "s": 173.04, "e": 178.17}, {"who": "Mother", "t": "What about your blue dress, Fiona?", "s": 178.4, "e": 180.82}, {"who": "Fiona", "t": "Is it clean? If it is, I'll wear that.", "s": 180.99, "e": 184.31}, {"who": "Mother", "t": "I washed it yesterday. You can wear your trousers tomorrow.", "s": 183.94, "e": 187.89}]}, {"label": "Question 4", "q": "What homework is the girl doing now?", "lines": [{"who": "Boy", "t": "Have you finished the science homework yet?", "s": 221.88, "e": 224.36}, {"who": "Girl", "t": "I'm still working on it. What are you doing?", "s": 224.38, "e": 227.75}, {"who": "Boy", "t": "I've done my maths and I've just started those English exercises.", "s": 227.77, "e": 232.56}, {"who": "Girl", "t": "I'm going to do them next.", "s": 232.65, "e": 234.66}]}, {"label": "Question 5", "q": "What's David going to buy?", "lines": [{"who": "David", "t": "I'm just going to the shops, Mum. Do you need anything?", "s": 265.48, "e": 268.83}, {"who": "Mother", "t": "Yes, get some fruit will you — some green cooking apples and some oranges to make juice with.", "s": 268.81, "e": 276.54}, {"who": "David", "t": "Well, we already have lots of oranges.", "s": 276.71, "e": 279.52}, {"who": "Mother", "t": "OK, just some apples then. I'll make the juice when you get back.", "s": 279.35, "e": 284.18}]}]}, {"key": "4_2", "test": 4, "part": 2, "title": "Matching", "blocks": [{"label": "Conversation", "q": null, "lines": [{"who": "Martin", "t": "You've got a big family, Sonya, haven't you?", "s": 31.32, "e": 34.11}, {"who": "Sonya", "t": "Well, Martin, there are six children altogether and I'm twenty and the oldest.", "s": 34.29, "e": 40.57}, {"who": "Martin", "t": "Wow! I know Vivienne, of course.", "s": 40.2, "e": 43.64}, {"who": "Martin", "t": "She had her fifteenth birthday last month, didn't she?", "s": 43.56, "e": 46.97}, {"who": "Sonya", "t": "That was Sally.", "s": 46.6, "e": 48.15}, {"who": "Sonya", "t": "Vivienne looks older but she's two years younger — but you mustn't say I told you she's only thirteen!", "s": 48.44, "e": 54.91}, {"who": "Martin", "t": "Of course I won't. Well, my little sister's seven ...", "s": 54.54, "e": 60.03}, {"who": "Sonya", "t": "... and she plays with my brother Roger.", "s": 60.01, "e": 62.73}, {"who": "Martin", "t": "So they must be the same age.", "s": 62.63, "e": 65.39}, {"who": "Sonya", "t": "They are. Then there's my other little brother, Frank.", "s": 65.02, "e": 69.33}, {"who": "Martin", "t": "And how old is he?", "s": 69.13, "e": 70.93}, {"who": "Sonya", "t": "He's two years younger than Roger.", "s": 70.56, "e": 73.45}, {"who": "Martin", "t": "So he's only five. There must be someone else.", "s": 76.32, "e": 80.79}, {"who": "Sonya", "t": "... Oh, Deborah! I nearly forgot.", "s": 80.73, "e": 83.69}, {"who": "Martin", "t": "Isn't she eighteen and starting at college in September?", "s": 83.65, "e": 87.24}, {"who": "Sonya", "t": "Yes, she's going to study medicine.", "s": 86.99, "e": 90.07}, {"who": "Sonya", "t": "She's wanted to do that since she was ten.", "s": 90.29, "e": 92.7}, {"who": "Martin", "t": "What a nice family!", "s": 92.88, "e": 94.72}]}]}, {"key": "4_3", "test": 4, "part": 3, "title": "Multiple choice", "blocks": [{"label": "Conversation", "q": null, "lines": [{"who": "Man", "t": "Can I help you?", "s": 53.58, "e": 54.89}, {"who": "Woman", "t": "I'd like some information about the mountain park.", "s": 55.02, "e": 58.25}, {"who": "Woman", "t": "I've got seven days' holiday next month.", "s": 58.29, "e": 61.18}, {"who": "Man", "t": "Yes, certainly.", "s": 60.81, "e": 62.3}, {"who": "Woman", "t": "First, I'd like to book somewhere to stay.", "s": 62.93, "e": 65.51}, {"who": "Man", "t": "I'm afraid there's nothing in the park, just a small café, that's all.", "s": 65.41, "e": 69.58}, {"who": "Man", "t": "The nearest guest-house is in a village a few kilometres away.", "s": 69.21, "e": 74.34}, {"who": "Woman", "t": "Has the village got somewhere to swim or a cinema?", "s": 74.59, "e": 78.33}, {"who": "Man", "t": "It's very quiet. There's just a small supermarket that sells food.", "s": 78.68, "e": 83.16}, {"who": "Woman", "t": "I don't mind that. Can I take my car to the park?", "s": 83.46, "e": 87.93}, {"who": "Man", "t": "Yes. But you must leave it at the entrance with the other cars and buses.", "s": 87.56, "e": 92.23}, {"who": "Man", "t": "Visitors must walk through the park.", "s": 92.31, "e": 94.58}, {"who": "Woman", "t": "And how much does it cost to go in?", "s": 94.76, "e": 97.48}, {"who": "Man", "t": "From Mondays to Fridays everyone pays twelve dollars,", "s": 97.41, "e": 101.17}, {"who": "Man", "t": "but at weekends it's thirteen dollars for children and sixteen dollars for adults.", "s": 101.13, "e": 105.93}, {"who": "Woman", "t": "Right. Will I see any animals in the park next month?", "s": 105.83, "e": 110.37}, {"who": "Man", "t": "I don't think so. But it's the best time to go!", "s": 110.0, "e": 113.63}, {"who": "Man", "t": "There won't be any snow and the flowers will be beautiful.", "s": 113.69, "e": 117.21}]}]}, {"key": "4_4", "test": 4, "part": 4, "title": "Note completion", "blocks": [{"label": "Conversation", "q": null, "lines": [{"who": "Sarah", "t": "Hello.", "s": 38.74, "e": 39.57}, {"who": "Mats", "t": "Hello, Sarah. It's Mats.", "s": 39.78, "e": 42.01}, {"who": "Sarah", "t": "Hi, Mats! How are you? Are you going to come to England in October?", "s": 41.64, "e": 46.08}, {"who": "Mats", "t": "Yes, I am. I'm really happy. I'm going to visit Manchester.", "s": 46.16, "e": 50.71}, {"who": "Mats", "t": "That's why I'm phoning. I have some questions.", "s": 50.74, "e": 53.69}, {"who": "Sarah", "t": "What do you need to know?", "s": 53.32, "e": 54.98}, {"who": "Mats", "t": "First, what will the weather be like? Will it be cold?", "s": 55.04, "e": 59.06}, {"who": "Sarah", "t": "Well, it'll be autumn — the temperature will be fourteen degrees.", "s": 59.15, "e": 64.71}, {"who": "Mats", "t": "So, what clothes shall I bring?", "s": 64.76, "e": 67.14}, {"who": "Sarah", "t": "Well, it rains a lot in Manchester, so bring a raincoat.", "s": 67.17, "e": 71.65}, {"who": "Mats", "t": "OK. Next question. How do I get to Manchester from Heathrow Airport?", "s": 71.59, "e": 77.46}, {"who": "Sarah", "t": "You can take the underground into the centre of London and then a train from Euston station.", "s": 77.71, "e": 82.84}, {"who": "Sarah", "t": "That's E-U-S-T-O-N. And there's also a plane from Heathrow to Manchester.", "s": 82.47, "e": 92.48}, {"who": "Mats", "t": "Which is the cheaper?", "s": 92.73, "e": 94.05}, {"who": "Sarah", "t": "The train, I think. It's thirty pounds.", "s": 93.99, "e": 97.39}, {"who": "Mats", "t": "And finally, can I bring you anything from my country, Sarah?", "s": 97.74, "e": 102.17}, {"who": "Sarah", "t": "Oh, yes, please! Can you bring me some cheese? I always like food.", "s": 101.8, "e": 107.47}, {"who": "Mats", "t": "No problem. See you in October.", "s": 107.58, "e": 110.43}, {"who": "Sarah", "t": "Bye!", "s": 110.25, "e": 111.14}]}]}, {"key": "4_5", "test": 4, "part": 5, "title": "Note completion", "blocks": [{"label": "Conversation", "q": null, "lines": [{"who": "Man", "t": "The Redfern Museum is closed today.", "s": 23.86, "e": 26.55}, {"who": "Man", "t": "Our opening hours are from half past one to half past four Monday to Thursday.", "s": 26.9, "e": 32.61}, {"who": "Man", "t": "The museum has things for you to see from the eighteenth century —", "s": 33.86, "e": 37.59}, {"who": "Man", "t": "the downstairs room shows the clothes of two hundred years ago.", "s": 37.95, "e": 42.35}, {"who": "Man", "t": "For example, you can see what children wore at school and what families wore for dinner.", "s": 42.7, "e": 48.29}, {"who": "Man", "t": "Upstairs, we are showing some important paintings by Spanish artists of the time.", "s": 49.2, "e": 54.37}, {"who": "Man", "t": "There's a short film about this exhibition every afternoon", "s": 54.73, "e": 58.02}, {"who": "Man", "t": "and there will be talks about some of these pictures in November.", "s": 58.18, "e": 61.77}, {"who": "Man", "t": "In the Garden Room, there will be free concerts all through December for visitors to the museum.", "s": 62.98, "e": 69.31}, {"who": "Man", "t": "A ticket to the museum costs five pounds for adults,", "s": 70.1, "e": 73.85}, {"who": "Man", "t": "three pounds eighty for students and two pounds fifty for children.", "s": 73.89, "e": 78.23}, {"who": "Man", "t": "We welcome school group visits.", "s": 79.21, "e": 81.58}, {"who": "Man", "t": "Please phone our Schools Officer for further information on double five seven six four two,", "s": 82.08, "e": 88.64}, {"who": "Man", "t": "between nine and five every day.", "s": 88.69, "e": 91.58}, {"who": "Man", "t": "Come to Redfern Museum soon. Thank you for calling.", "s": 92.17, "e": 96.3}]}]}];
const AUD={"1_1": "ket3_t1_p1.mp3", "1_2": "ket3_t1_p2.mp3", "1_3": "ket3_t1_p3.mp3", "1_4": "ket3_t1_p4.mp3", "1_5": "ket3_t1_p5.mp3", "2_1": "ket3_t2_p1.mp3", "2_2": "ket3_t2_p2.mp3", "2_3": "ket3_t2_p3.mp3", "2_4": "ket3_t2_p4.mp3", "2_5": "ket3_t2_p5.mp3", "3_1": "ket3_t3_p1.mp3", "3_2": "ket3_t3_p2.mp3", "3_3": "ket3_t3_p3.mp3", "3_4": "ket3_t3_p4.mp3", "3_5": "ket3_t3_p5.mp3", "4_1": "ket3_t4_p1.mp3", "4_2": "ket3_t4_p2.mp3", "4_3": "ket3_t4_p3.mp3", "4_4": "ket3_t4_p4.mp3", "4_5": "ket3_t4_p5.mp3"};
const au=document.getElementById('au');
let cur=null, segEnd=null, segRow=null, revealed=false, rafId=null;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const fmt=s=>{s=Math.max(0,s|0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const words=s=>s.replace(/…|\.\.\./g,' ').split(/\s+/).filter(w=>/[A-Za-z0-9]/.test(w)).length;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let test=+(ls('ket_test')||1), part=+(ls('ket_part')||1);
function renderTabs(){
  const tabs=document.getElementById('tabs');
  tabs.innerHTML=[1,2,3,4].map(t=>`<button class="${t===test?'on':''}" data-t="${t}">Test ${t}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{test=+b.dataset.t;load()});
  const parts=document.getElementById('parts');
  parts.innerHTML=DATA.filter(d=>d.test===test).map(d=>`<button class="${d.part===part?'on':''}" data-p="${d.part}"><div class="k">PART ${d.part}</div><div class="t">${esc(d.title)}</div></button>`).join('');
  parts.querySelectorAll('button').forEach(b=>b.onclick=()=>{part=+b.dataset.p;load()});
}
function load(){
  ls('ket_test',test);ls('ket_part',part);
  cur=DATA.find(d=>d.test===test&&d.part===part);
  stopSeg(); au.pause(); au.src=AUD[cur.key]; au.load(); setRate(curRate);
  revealed=false; document.getElementById('revAll').textContent='👁 Hiện tất cả';
  renderTabs();
  document.getElementById('pttl').textContent=`Test ${test} · Part ${part} — ${cur.title}`;
  document.getElementById('ptitle').textContent=`Test ${test} · Part ${part}`;
  const L=document.getElementById('list');
  L.innerHTML=cur.blocks.map((b,bi)=>{
    const ex=b.label==='Example';
    return `<div class="block">${b.label==='Conversation'?'':`<div class="bh"><span class="tag${ex?' ex':''}">${ex?'Example · mẫu':b.label}</span>${b.q?`<span class="q">${esc(b.q)}</span>`:''}</div>`}`+
      b.lines.map((l,li)=>`<div class="ln" data-b="${bi}" data-l="${li}"><button class="no" aria-label="Nghe câu ${li+1}">${li+1}</button><div class="who">${esc(l.who)}:</div><div class="txt${ex?' ex':''}">${ex?esc(l.t):`<span class="hid" data-full="${esc(l.t)}">Bấm để xem câu</span>`}</div><div class="cnt">(${words(l.t)} từ)</div></div>`).join('')+'</div>';
  }).join('');
  L.querySelectorAll('.ln').forEach(r=>{
    const l=cur.blocks[+r.dataset.b].lines[+r.dataset.l];
    r.querySelector('.no').onclick=()=>playSeg(l.s,l.e,r);
    const h=r.querySelector('.hid'); if(h) h.onclick=()=>reveal(h);
  });
  updUI();
}
function reveal(h){const s=document.createElement('span');s.textContent=h.dataset.full;h.replaceWith(s)}
document.getElementById('revAll').onclick=function(){
  if(!revealed){document.querySelectorAll('.hid').forEach(reveal);revealed=true;this.textContent='🙈 Ẩn lại';}
  else{load();}
};
function mark(row){document.querySelectorAll('.ln.now').forEach(x=>x.classList.remove('now'));if(row)row.classList.add('now')}
function stopSeg(){segEnd=null;segRow=null;if(rafId)cancelAnimationFrame(rafId);rafId=null}
function watch(){
  if(segEnd!=null && au.currentTime>=segEnd){au.pause();stopSeg();updUI();return}
  rafId=requestAnimationFrame(watch);
}
function playSeg(s,e,row){
  if(s==null)return;
  stopSeg(); segEnd=e; segRow=row; mark(row);
  au.currentTime=Math.max(0,s);
  const p=au.play(); if(p&&p.catch)p.catch(()=>{});
  rafId=requestAnimationFrame(watch);
}
function rowAt(t){
  for(const r of document.querySelectorAll('.ln')){const l=cur.blocks[+r.dataset.b].lines[+r.dataset.l];if(l.s!=null&&t>=l.s&&t<=l.e)return r}
  return null;
}
function updUI(){
  const d=au.duration||0, t=au.currentTime||0;
  document.getElementById('pstat').textContent=`${fmt(t)} / ${fmt(d)}${segEnd!=null?' · đang nghe 1 câu':''}`;
  if(!seeking) document.getElementById('seek').value=d?Math.round(t/d*1000):0;
  document.getElementById('bigBtn').textContent=au.paused?'▶':'❚❚';
  if(segEnd==null){ if(!au.paused) mark(rowAt(t)); }
}
let seeking=false;
const seek=document.getElementById('seek');
seek.oninput=()=>{seeking=true;if(au.duration){au.currentTime=seek.value/1000*au.duration}};
seek.onchange=()=>{seeking=false;stopSeg()};
au.ontimeupdate=updUI; au.onplay=updUI; au.onpause=updUI; au.onloadedmetadata=updUI;
au.onended=()=>{stopSeg();mark(null);updUI()};
document.getElementById('bigBtn').onclick=()=>{
  if(au.paused){ if(segEnd!=null&&au.currentTime>=segEnd) stopSeg(); const p=au.play(); if(p&&p.catch)p.catch(()=>{}); }
  else au.pause();
};
document.getElementById('back2').onclick=()=>{au.currentTime=Math.max(0,au.currentTime-2);updUI()};
document.getElementById('fwd2').onclick=()=>{au.currentTime=Math.min(au.duration||0,au.currentTime+2);if(segEnd!=null&&au.currentTime>=segEnd)stopSeg();updUI()};
document.getElementById('restart').onclick=()=>{stopSeg();mark(null);au.currentTime=0;const p=au.play();if(p&&p.catch)p.catch(()=>{})};
let curRate=1;
function setRate(r){curRate=r;au.playbackRate=r;document.querySelectorAll('#spd button').forEach(b=>b.classList.toggle('on',+b.dataset.r===r))}
document.querySelectorAll('#spd button').forEach(b=>b.onclick=()=>setRate(+b.dataset.r));
load();
</script>
