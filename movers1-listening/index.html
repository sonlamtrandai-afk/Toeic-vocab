, {"who": "Woman", "t": "Is it blue?", "s": 28.55, "e": 29.91}, {"who": "Girl", "t": "No, it's yellow.", "s": 30.09, "e": 31.87}]}, {"label": "Question 1", "q": "What does Daisy want for supper?", "lines": [{"who": "Girl", "t": "I'm hungry, Mum.", "s": 50.26, "e": 52.2}, {"who": "Woman", "t": "What would you like for supper, Daisy, a burger?", "s": 52.32, "e": 55.67}, {"who": "Girl", "t": "No, I had a burger at school today. Can I have some pasta?", "s": 55.94, "e": 61.31}, {"who": "Woman", "t": "Yes, with some juice and bread?", "s": 61.35, "e": 64.57}, {"who": "Girl", "t": "I'm thirsty but I don't want any bread.", "s": 64.91, "e": 68.55}]}, {"label": "Question 2", "q": "What did Sally get for her birthday?", "lines": [{"who": "Girl", "t": "It was Sally's birthday last week.", "s": 79.05, "e": 81.48}, {"who": "Woman", "t": "Oh, what did her parents give her?", "s": 81.46, "e": 84.26}, {"who": "Girl", "t": "I don't know.", "s": 84.62, "e": 85.86}, {"who": "Woman", "t": "She wanted a guitar or a computer.", "s": 86.83, "e": 90.08}, {"who": "Girl", "t": "Well, they didn't give her those. Oh yes, I know. They gave her a new camera.", "s": 90.65, "e": 97.24}, {"who": "Woman", "t": "She'll like that. She loves taking photos.", "s": 97.31, "e": 101.12}]}, {"label": "Question 3", "q": "Where did Peter go at the weekend?", "lines": [{"who": "Woman", "t": "Where did your friend Peter go at the weekend?", "s": 112.17, "e": 115.37}, {"who": "Girl", "t": "Well, he wanted to go and watch a basketball game.", "s": 115.43, "e": 119.17}, {"who": "Woman", "t": "So did he go?", "s": 119.26, "e": 121.16}, {"who": "Girl", "t": "No, he couldn't. His mum wanted to go to the mountains for the weekend and his dad wanted to go to the sea.", "s": 121.96, "e": 129.5}, {"who": "Woman", "t": "Did he go to the sea then?", "s": 129.74, "e": 131.64}, {"who": "Girl", "t": "No, his dad had to work but he went with his mum to the mountains.", "s": 131.86, "e": 136.78}]}, {"label": "Question 4", "q":   L.innerHTML=cur.blocks.map((b,bi)=>{
    const ex=b.label==='Example';
    return `<div class="block"><div class="bh"><span class="tag${ex?' ex':''}">${ex?'Example · mẫu':b.label}</span>${b.q?`<span class="q">${esc(b.q)}</span>`:''}</div>`+
      b.lines.map((l,li)=>`<div class="ln" data-b="${bi}" data-l="${li}"><button class="no" aria-label="Nghe câu ${li+1}">${li+1}</button><div class="who">${esc(l.who)}:</div><div class="txt${ex?' ex':''}">${ex?esc(l.t):`<span class="hid" data-full="${esc(l.t)}">Bấm để xem câu</span>`}</div><div class="cnt">(${words(l.t)} từ)</div></div>`).join('')+'</div>';
  }).join('');
  L.querySelectorAll('.ln').forEach(r=>{
    const l=cur.blocks[+r.dataset.b].lines[+r.dataset.l];
    r.querySelector('.no').onclick=()=>playSeg(l.s,l.e,r);
    const h=r.querySelector('.hid'); if(h) h.onclick=()=>reveal(h);
  });
  updUI();
}
function reveal(h){const s=document.createElement('span');s.textContent=h.dataset.full;h.replaceWith(s)}
document.getElementById('revAll').onclick=function(){
  if(!revealed){document.querySelectorAll('.hid').forEach(reveal);revealed=true;this.textContent='🙈 Ẩn lại';}
  else{load();}
};
function mark(row){document.querySelectorAll('.ln.now').forEach(x=>x.classList.remove('now'));if(row)row.classList.add('now')}
function stopSeg(){segEnd=null;segRow=null;if(rafId)cancelAnimationFrame(rafId);rafId=null}
function watch(){
  if(segEnd!=null && au.currentTime>=segEnd){au.pause();stopSeg();updUI();return}
  rafId=requestAnimationFrame(watch);
}
function playSeg(s,e,row){
  if(s==null)return;
  stopSeg(); segEnd=e; segRow=row; mark(row);
  au.currentTime=Math.max(0,s);
  const p=au.play(); if(p&&p.catch)p.catch(()=>{});
  rafId=requestAnimationFrame(watch);
}
function rowAt(t){
  for(const r of document.querySelectorAll('.ln')){const l=cur.blocks[+r.dataset.b].lines[+r.dataset.l];if(l.s!=null&&t>=l.s&&t<=l.e)return r}
  return null;
}
function updUI(){
  const d=au.duration||0, t=au.currentTime||0;
  document.getElementById('pstat').textContent=`${fmt(t)} / ${fmt(d)}${segEnd!=null?' · đang nghe 1 câu':''}`;
  if(!seeking) document.getElementById('seek').value=d?Math.round(t/d*1000):0;
  document.getElementById('bigBtn').textContent=au.paused?'▶':'❚❚';
  if(segEnd==null){ if(!au.paused) mark(rowAt(t)); }
}
let seeking=false;
const seek=document.getElementById('seek');
seek.oninput=()=>{seeking=true;if(au.duration){au.currentTime=seek.value/1000*au.duration}};
seek.onchange=()=>{seeking=false;stopSeg()};
au.ontimeupdate=updUI; au.onplay=updUI; au.onpause=updUI; au.onloadedmetadata=updUI;
au.onended=()=>{stopSeg();mark(null);updUI()};
document.getElementById('bigBtn').onclick=()=>{
  if(au.paused){ if(segEnd!=null&&au.currentTime>=segEnd) stopSeg(); const p=au.play(); if(p&&p.catch)p.catch(()=>{}); }
  else au.pause();
};
document.getElementById('back2').onclick=()=>{au.currentTime=Math.max(0,au.currentTime-2);updUI()};
document.getElementById('fwd2').onclick=()=>{au.currentTime=Math.min(au.duration||0,au.currentTime+2);if(segEnd!=null&&au.currentTime>=segEnd)stopSeg();updUI()};
document.getElementById('restart').onclick=()=>{stopSeg();mark(null);au.currentTime=0;const p=au.play();if(p&&p.catch)p.catch(()=>{})};
let curRate=1;
function setRate(r){curRate=r;au.playbackRate=r;document.querySelectorAll('#spd button').forEach(b=>b.classList.toggle('on',+b.dataset.r===r))}
document.querySelectorAll('#spd button').forEach(b=>b.onclick=()=>setRate(+b.dataset.r));
load();
</script>
</body>
</html>
